  .ana .card h3 { display: flex; gap: 8px; align-items: center; }
  .num { width: 2em; height: 2em; border-radius: 50%; display: grid; place-items: center; background: var(--pink); color: #fff; font-weight: 800; font-size: .85rem; flex: none; }

const GUIDE_ORDER = ["page", "card", "api", "main", "db"];
const GUIDE_KEYS = GUIDE_ORDER.map(k => GUIDE[k][1]);
let gsel = 0;
function guide() {
  $("#gfiles").innerHTML = GUIDE_ORDER.map((k, i) => `<button class="chip" data-i="${i}" aria-pressed="${i === gsel}">${GUIDE[k][0]}</button>`).join("");
  document.querySelectorAll("#gfiles .chip").forEach(b => b.onclick = () => { gsel = +b.dataset.i; guide(); });
  const k = GUIDE_ORDER[gsel], [title, path, rows] = GUIDE[k];
  $("#gopen").innerHTML = `<a class="ref" href="${REPO}${path}" target="_blank" rel="noopener">${title.split("（")[0]} を GitHub で開く ↗</a>`;
  $("#guide").innerHTML = rows.map(r => {
    if (r[0] === "#") return `<div class="gl sec"><span></span><span>${r[1]}</span></div>`;
    const [a, b] = r[0].split("-").map(Number);
    return `<div class="gl"><a href="${REPO}${path}#L${a}${b ? "-L" + b : ""}" target="_blank" rel="noopener">${r[0].replace("-", "〜")}行</a><span>${r[1]}${r[2] ? `<span class="tip">たとえ：${r[2]}</span>` : ""}</span></div>`;
  }).join("");
